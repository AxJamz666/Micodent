name: Arranque Windows
on:
  push:
    branches: ['codex/arranque-v3-controlado']
  pull_request:
    paths: ['operacion/**', '.github/workflows/arranque.yml']
permissions:
  contents: read
jobs:
  launcher:
    name: Arranque aislado Windows
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
      - run: node --test operacion/tests/arranque.test.cjs
